name: bluebuild
on:
  # Local-first phase (2026-08-28): image builds are manual-only while feature
  # work happens on the host. Re-enable push/schedule triggers when the image
  # starts consuming the desktop/osctl components.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  bluebuild:
    name: Build Koti image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        recipe:
          - koti.yml
          # - koti-nvidia.yml   # enable with task M0-06
    steps:
      - name: Build custom image
        uses: blue-build/github-action@v1.11
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: true
