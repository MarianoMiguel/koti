[package]
name = "osctl"
version = "0.1.0"
edition = "2021"
description = "Koti system control: security state, audit, customization, boxes (PRD §66)"
license = "MIT"

# PRD §72: small dependency surface — justify every addition.
[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1" # parsing `rpm-ostree status --json` for image/layering checks
agentboxd = { path = "../agentboxd" } # `osctl box` shares the box command surface (PRD §26)
