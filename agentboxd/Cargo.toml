[package]
name = "agentboxd"
version = "0.1.0"
edition = "2021"
description = "Koti Agent Box daemon: VM lifecycle, networking, display, storage (PRD §41)"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "agentboxd"
path = "src/main.rs"

[[bin]]
name = "box"
path = "src/bin/box.rs"
