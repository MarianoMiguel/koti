# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# Published to ghcr.io/marianomiguel/koti
name: koti
description: Koti — a secure desktop that feels like home. secureblue Kinoite derivative (AMD/Intel).

base-image: ghcr.io/secureblue/kinoite-main-hardened
image-version: latest

# First-party components compile in a hermetic builder stage — same stages the
# Builder VM (M1-04) will run later. See docs/image-integration.md.
# Fedora builder ≈ runtime glibc family; digest pinning tracked in M1-09.
stages:
  - name: components
    from: registry.fedoraproject.org/fedora:42
    modules:
      - type: copy
        src: .
        dest: /src
      - type: script
        snippets:
          - dnf install -y rust cargo nodejs npm
          - cd /src && cargo build --release --workspace
          - cd /src/desktop/kwin-policy && npm ci && npm run build:kwin
          - mkdir -p /out/bin /out/kwin && cp /src/target/release/osctl /src/target/release/agentboxd /src/target/release/box /out/bin/ && cp -r /src/desktop/kwin-policy/package/. /out/kwin/

modules:
  - type: files
    files:
      - source: system
        destination: /

  # PRD §81 host control-plane tools (M6-03). Language runtimes stay out —
  # they belong in Boxes/Workshop.
  - type: dnf
    install:
      packages:
        - git
        - gh
        - ripgrep
        - neovim

  # Ghostty (PRD §81) has no Fedora package and no Flathub listing; the
  # scottames COPR is the one Universal Blue uses. Layered rather than
  # Flatpak'd because the default terminal has to exist before any Flatpak
  # does. `cleanup` drops the repo after install, so the shipped image carries
  # no third-party repo.
  #
  # The .repo file rather than `copr:` — `dnf copr enable` cannot work out the
  # chroot on a bootc base and bails with the whole chroot list (build
  # 33236397207). The repo file templates $releasever/$basearch, so it also
  # follows the base image to Fedora 45 instead of pinning a chroot, and it
  # keeps gpgcheck against the COPR key.
  - type: dnf
    repos:
      cleanup: true
      files:
        add:
          - https://copr.fedorainfracloud.org/coprs/scottames/ghostty/repo/fedora-44/scottames-ghostty-fedora-44.repo
    install:
      packages:
        - ghostty

  # ChatGPT desktop, OpenAI's own Linux build (public preview since
  # 2026-08-11, supporting Fedora 43/44). Installed from the vendor URL because
  # OpenAI publishes no standalone repo definition — the package configures its
  # signed repo itself on install. `latest` is unpinned by design here: it is a
  # preview that moves fast, and each image build re-resolves it.
  - type: dnf
    install:
      packages:
        - https://persistent.oaistatic.com/codex-app-prod/linux/rpm/latest/chatgpt.x86_64.rpm

  # First-party CLIs and daemon (osctl, agentboxd, box)
  - type: copy
    from: components
    src: /out/bin/
    dest: /usr/bin/

  # Window policy KWin script (bundled)
  - type: copy
    from: components
    src: /out/kwin/
    dest: /usr/share/kwin/scripts/org.koti.windowpolicy/

  # Plasma packages ship as plain data straight from the repo
  - type: copy
    src: desktop/plasma/mode-selector
    dest: /usr/share/plasma/plasmoids/org.koti.modeselector/

  - type: copy
    src: desktop/plasma/workspace-indicator
    dest: /usr/share/plasma/plasmoids/org.koti.workspaceindicator/

  - type: copy
    src: desktop/plasma/stage-rail
    dest: /usr/share/plasma/plasmoids/org.koti.stagerail/

  - type: copy
    src: desktop/plasma/shell-layout
    dest: /usr/share/plasma/look-and-feel/org.koti.lookandfeel/

  # Plasma Style whose panel patch draws nothing — the transparent top bar and
  # dock of PRD §9. Everything it does not define falls back to Breeze.
  - type: copy
    src: desktop/plasma/style
    dest: /usr/share/plasma/desktoptheme/org.koti.transparent/

  # Flatpaks. secureblue's default remote is flathub-verified, which filters by
  # *publisher* — that is why Slack and much else never appear in Bazaar.
  # Mariano's call (2026-08-29): carry full Flathub, so the software the machine
  # is for is actually installable. `osctl audit` reports the widened remote as
  # an intentional deviation rather than pretending the default still holds.
  - type: default-flatpaks
    configurations:
      - scope: system
        repo:
          url: https://dl.flathub.org/repo/flathub.flatpakrepo
          name: flathub
          title: Flathub
        install:
          - com.slack.Slack
        notify: false

  - type: signing
